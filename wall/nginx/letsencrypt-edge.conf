# Optional HTTP port 80 edge server for ACME HTTP-01 challenges and forced HTTPS redirection.
# Never serves application content over plain HTTP.
server {
    server_tokens off;
    listen 80;
    server_name ${NGINX_PUBLIC_HOSTNAME};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
