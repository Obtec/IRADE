# Temporary subpath deployment of IRADE under frelog.p-e.kr (/irade/, /api/irade/, /wss/.../workspace/...).
# Install at /etc/nginx/snippets/irade-web.conf (included inside /etc/nginx/sites-available/frelog.conf).
location = /irade { return 308 /irade/$is_args$args; }
location ^~ /irade/ {
    proxy_pass https://127.0.0.1:8453;
    include /etc/nginx/snippets/irade-gateway-proxy.conf;
    proxy_read_timeout 90s;
}
# Preserve previously shared links and their workspace query parameters.
location = /ide { return 308 /irade/$is_args$args; }
location /ide/ { return 308 /irade/$is_args$args; }
location ^~ /irade-assets/ {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json;
    proxy_pass https://127.0.0.1:8453;
    include /etc/nginx/snippets/irade-gateway-proxy.conf;
    proxy_read_timeout 90s;
}
# OAuth authorization codes are single-use credentials; omit callback query strings from access logs.
location = /api/irade/auth/orcid/callback {
    access_log off;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    proxy_pass https://127.0.0.1:8453;
    include /etc/nginx/snippets/irade-gateway-proxy.conf;
    proxy_read_timeout 90s;
}
location ^~ /api/irade/ {
    proxy_pass https://127.0.0.1:8453;
    include /etc/nginx/snippets/irade-gateway-proxy.conf;
    proxy_read_timeout 90s;
}
location ~ ^/wss/port/(?<irade_cpp_ws_port>80(?:0[2-9]|[1-9][0-9]))/(?<irade_ws_channel>(?:rtc/)?workspace)/(?<irade_ws_id>[0-9]+)$ {
    proxy_pass https://127.0.0.1:8453;
    include /etc/nginx/snippets/irade-gateway-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
