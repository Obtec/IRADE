# Host Nginx virtual host template for IRADE (proof-notebook.p-e.kr).
# Install separately at /etc/nginx/sites-available/proof-notebook.p-e.kr.conf
# without disturbing existing Agora virtual hosts.

# Optional: uncomment only if host TCP/80 is opened for ACME HTTP-01 & HTTPS redirect.
# server {
#     server_tokens off;
#     listen 80;
#     server_name proof-notebook.p-e.kr;
#
#     location ^~ /.well-known/acme-challenge/ {
#         root /var/www/letsencrypt;
#         default_type text/plain;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

server {
    server_tokens off;
    listen 443 ssl;
    server_name proof-notebook.p-e.kr;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/proof-notebook.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proof-notebook.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:IradePublicSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Common upstream TLS verification to IRADE Wall Nginx (127.0.0.1:8453).
    # Note: If irade-nginx uses the synced Let's Encrypt certificate, verify against
    # /etc/ssl/certs/ca-certificates.crt with proxy_ssl_name proof-notebook.p-e.kr.
    # If irade-nginx uses internal tls-dev CA, set proxy_ssl_trusted_certificate to
    # /home/steam/.local/share/irade/tls-dev/root-ca.pem and proxy_ssl_name irade-nginx.
    location = /api/irade/auth/orcid/callback {
        access_log off;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass https://127.0.0.1:8453;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name proof-notebook.p-e.kr;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/api/workspaces/[1-9][0-9]*/runtime/(?:notebook|build|java/dependencies|execute/stream)$ {
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass https://127.0.0.1:8453;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name proof-notebook.p-e.kr;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/api/workspaces/[1-9][0-9]*/media(?:/|$) {
        client_max_body_size 102m;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_pass https://127.0.0.1:8453;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name proof-notebook.p-e.kr;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/wss/ {
        proxy_pass https://127.0.0.1:8453;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name proof-notebook.p-e.kr;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass https://127.0.0.1:8453;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name proof-notebook.p-e.kr;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
    }
}
