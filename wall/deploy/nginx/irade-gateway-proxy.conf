# Upstream TLS verification and forwarding headers for IRADE Wall Nginx (127.0.0.1:8453).
# Install at /etc/nginx/snippets/irade-gateway-proxy.conf with public CA at /etc/nginx/ssl/irade-root-ca.pem.
proxy_ssl_trusted_certificate /etc/nginx/ssl/irade-root-ca.pem;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_server_name on;
proxy_ssl_name irade-nginx;
proxy_ssl_protocols TLSv1.3;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
