name: irade-storage-broker
services:
  storage-broker:
    image: haproxy:3.2-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    container_name: irade-storage-broker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      STORAGE_MSSQL_UPSTREAM: ${STORAGE_MSSQL_UPSTREAM:-mssql:1433}
      STORAGE_ES_UPSTREAM: ${STORAGE_ES_UPSTREAM:-elasticsearch:9200}
      STORAGE_REDIS_PRIMARY_UPSTREAM: ${STORAGE_REDIS_PRIMARY_UPSTREAM:-10.26.0.2:6379}
      STORAGE_REDIS_REPLICA_1_UPSTREAM: ${STORAGE_REDIS_REPLICA_1_UPSTREAM:-10.26.0.7:6379}
      STORAGE_REDIS_REPLICA_2_UPSTREAM: ${STORAGE_REDIS_REPLICA_2_UPSTREAM:-10.26.0.5:6379}
      STORAGE_SENTINEL_1_UPSTREAM: ${STORAGE_SENTINEL_1_UPSTREAM:-10.26.0.6:26379}
      STORAGE_SENTINEL_2_UPSTREAM: ${STORAGE_SENTINEL_2_UPSTREAM:-10.26.0.3:26379}
      STORAGE_SENTINEL_3_UPSTREAM: ${STORAGE_SENTINEL_3_UPSTREAM:-10.26.0.4:26379}
    volumes:
      - ./storage-broker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      irade-services:
        aliases: [irade-mssql, irade-elasticsearch]
      irade-net: {}
      redis-ha:
        ipv4_address: ${STORAGE_REDIS_BROKER_IP:-10.26.0.21}
    healthcheck:
      test: [CMD, haproxy, -c, -f, /usr/local/etc/haproxy/haproxy.cfg]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  irade-services:
    name: irade-services
    internal: true
    ipam:
      config:
        - subnet: ${IRADE_SERVICES_SUBNET:-10.29.0.0/16}
  irade-net:
    external: true
    name: irade-net
  redis-ha:
    external: true
    name: irade-redis-ha
