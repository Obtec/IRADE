[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean4-jupyter-kernel"
version = "0.1.0"
description = "Interactive Jupyter kernel for Lean 4 powered by leanprover-community/repl"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["lean", "lean4", "rocq", "coq", "jupyter", "theorem-proving", "formal-verification", "mathlib"]
classifiers = [
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ipykernel>=6.20",
    "jupyter_client>=8.0",
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/Obtec/proof-notebook"
Repository = "https://github.com/Obtec/proof-notebook.git"
Issues = "https://github.com/Obtec/proof-notebook/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "nbclient>=0.8",
    "nbformat>=5.0",
]

[project.scripts]
lean4-kernel = "lean4_kernel.install:main"
lean4-proof-studio = "lean4_kernel.web:serve"
rocq-kernel = "rocq_kernel.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lean4_kernel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

