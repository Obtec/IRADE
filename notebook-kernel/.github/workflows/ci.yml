name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Lean 4 (elan)
        uses: leanprover/action-elan@v1
        with:
          toolchain: leanprover/lean4:v4.35.0

      - name: Cache vendor/repl build
        uses: actions/cache@v4
        with:
          path: vendor/repl/.lake
          key: repl-lake-${{ runner.os }}-v4.35.0

      - name: Build Lean REPL binary
        run: lake -d vendor/repl build repl

      - name: Verify formal Lean example
        run: lean examples/Arithmetic.lean

      - name: Install Python dependencies and kernelspec
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
          lean4-kernel install --sys-prefix
          lean4-kernel doctor

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run pytest suite
        run: pytest -v
