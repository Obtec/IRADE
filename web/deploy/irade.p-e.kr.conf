# Host Nginx virtual host for the standalone IRADE domain.
server {
    server_tokens off;
    # Public TLS is routed here by the host's SNI stream listener.
    listen 127.0.0.1:9446 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name irade.p-e.kr;
    client_max_body_size 102m;

    ssl_certificate /home/steam/.local/share/irade/letsencrypt/irade.p-e.kr/fullchain.pem;
    ssl_certificate_key /home/steam/.local/share/irade/letsencrypt/irade.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:IradePublicSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_ssl_trusted_certificate /home/steam/.local/share/irade/tls-dev/root-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name irade-nginx;
    proxy_ssl_protocols TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";

    # Authorization codes must not be written to URI logs or sent as a referrer.
    location = /api/irade/auth/orcid/callback {
        access_log off;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_pass https://127.0.0.1:8453;
    }

    location ~ ^/api/workspaces/[1-9][0-9]*/runtime/(?:notebook|build|java/dependencies|execute/stream)$ {
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass https://127.0.0.1:8453;
    }

    location ~ ^/api/workspaces/[1-9][0-9]*/media(?:/|$) {
        client_max_body_size 102m;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_pass https://127.0.0.1:8453;
    }

    location = /api/terminal/ws {
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_pass https://127.0.0.1:8453;
    }

    location ^~ /wss/ {
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass https://127.0.0.1:8453;
    }

    # The gateway dispatches API, web execution, and broker routes to their services.
    location /api/ {
        proxy_read_timeout 90s;
        proxy_pass https://127.0.0.1:8453;
    }

    location / {
        proxy_read_timeout 90s;
        proxy_pass https://127.0.0.1:8453;
    }
}

server {
    server_tokens off;
    listen 80;
    server_name irade.p-e.kr;

    location / {
        return 301 https://irade.p-e.kr$request_uri;
    }
}
