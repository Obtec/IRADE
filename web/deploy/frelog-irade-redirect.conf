# Optional legacy redirects for links shared before the standalone domain.
# Include inside FreLog's HTTPS vhost only after https://irade.p-e.kr/ is live.
location = /irade {
    return 308 https://irade.p-e.kr/$is_args$args;
}
location ^~ /irade/ {
    rewrite ^/irade/(.*)$ https://irade.p-e.kr/$1 permanent;
}
location = /ide {
    return 308 https://irade.p-e.kr/studio/$is_args$args;
}
location ^~ /ide/ {
    rewrite ^/ide/(.*)$ https://irade.p-e.kr/$1 permanent;
}
