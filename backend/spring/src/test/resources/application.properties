spring.application.name=frelog-test

# Separate IP and Port variables for testing consistency
app.db.host=h2-test
app.db.port=-1

app.db.name=irade_db
app.db.username=sa
app.db.password=
app.db.auto-fallback=true

# Use H2 database for isolated automated test execution
spring.datasource.url=jdbc:h2:mem:irade_db;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT settings
jwt.secret=test-only-jwt-signing-secret-never-use-in-production-0123456789
jwt.expiration-ms=3600000

# Elasticsearch test settings
app.elasticsearch.host=localhost
app.elasticsearch.port=9200
app.elasticsearch.index=workspace
app.elasticsearch.workspace-index=workspace
app.elasticsearch.fail-on-error=false
app.elasticsearch.username=test
app.elasticsearch.password=test
app.redis.username=test
app.redis.password=test

# Durable VM cleanup table is managed by the administrator SQL migration in production.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:runtime-cleanup-test.sql
app.service-tls-ca=${test.ca.path:src/test/resources/test-ca.pem}
app.wall.cpp-api-origin=https://irade-nginx:8444
app.elasticsearch.search-index=workspace-search
