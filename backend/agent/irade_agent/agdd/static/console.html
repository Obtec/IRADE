<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGDD Console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --accent:#2f5d50;
          --ok:#2f7d4f; --warn:#a86b00; --bad:#b3261e; --chip:#efeee8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1e1e1c; --ink:#ecebe6; --muted:#9a998f;
          --line:#33332f; --accent:#7fc0a9; --ok:#6fcf97; --warn:#e0b050; --bad:#f2827a; --chip:#2a2a27; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  header { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; }
  header h1 { font-size:16px; margin:0 12px 0 0; letter-spacing:.02em; }
  main { display:grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 58px); }
  nav { border-right:1px solid var(--line); padding:12px 8px; }
  nav button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 12px; border-radius:6px; color:var(--ink); cursor:pointer; font:inherit; }
  nav button.on { background:var(--chip); font-weight:600; }
  section { padding:20px 24px; max-width:1200px; }
  h2 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  textarea { width:100%; min-height:220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; }
  button.b { font:inherit; border:1px solid var(--accent); background:var(--accent); color:var(--bg); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.g { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .tbl { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .chip { display:inline-block; padding:1px 8px; border-radius:99px; background:var(--chip); font-size:12px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12.5px; background:var(--chip); padding:10px; border-radius:6px; max-height:420px; overflow:auto; margin:0; }
  #toast { position:fixed; right:16px; bottom:16px; max-width:420px; padding:10px 14px; border-radius:8px; background:var(--ink); color:var(--bg); display:none; }
  .muted { color:var(--muted); } .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  .term { height: 460px; background:#111; border-radius:6px; padding:6px; }
  .grid2 { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
  .bar { height:8px; border-radius:99px; background:var(--chip); overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); }
  section.wide { max-width:none; }
  .content { min-width:0; } #studio-host { padding:0 24px 20px; } @media (max-width:760px) { #studio-host { padding:0 16px 16px; } }
  .skeleton { height:14px; border-radius:6px; margin:10px 0; width:100%; background:linear-gradient(90deg,var(--chip),var(--line),var(--chip)); background-size:200% 100%; animation:sk 1.1s infinite linear; }
  @keyframes sk { to { background-position:-200% 0; } }
  .ide { display:grid; grid-template-columns: 250px minmax(0,1fr) 280px; gap:0; height: calc(100vh - 180px); min-height:480px;
         border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .ide-col { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  .ide-col:last-child { border-right:0; }
  .ide-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line);
              font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .ide-scroll { overflow:auto; flex:1; min-height:0; padding:4px 0; }
  .tree-row { display:flex; align-items:center; padding-right:4px; }
  .tree-row:hover, .tree-row.on { background:var(--chip); }
  .tree-row.on .tree-item { font-weight:600; }
  .tree-row .tree-acts { display:none; gap:1px; flex-shrink:0; }
  .tree-row:hover .tree-acts { display:inline-flex; }
  .tree-item { display:flex; align-items:center; gap:6px; flex:1; min-width:0; border:0; background:none; color:var(--ink); font:12.5px/1.2 ui-monospace, Menlo, monospace;
               padding:5px 8px; cursor:pointer; text-align:left; white-space:nowrap; overflow:hidden; }
  .tree-item .st { margin-left:auto; font-size:10.5px; font-weight:700; }
  .ide-split { display:grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap:12px; align-items:stretch; }
  .ide-split .ide { grid-template-columns: 220px minmax(0, 1fr); }
  .ide-bottom { border-top:1px solid var(--line); background:var(--bg); }
  .collab-grid { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:12px; align-items:start; }
  .collab-feed { flex:1; min-height:0; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .collab-composer { border-top:1px solid var(--line); padding:10px 12px; background:var(--bg); }
  .collab-rail { display:flex; flex-direction:column; gap:10px; }
  .cmsg { border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); }
  .cmsg-user { border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); background:color-mix(in srgb,var(--accent) 6%,var(--panel)); }
  .cmsg-event { background:var(--bg); font-size:12.5px; }
  .cmsg-head { display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:12px; }
  .cmsg-body { white-space:pre-wrap; word-break:break-word; font-size:13.5px; }
  .collab-stepper { display:flex; flex-wrap:wrap; gap:4px; }
  .step-pill { padding:2px 8px; border-radius:99px; font-size:11px; border:1px solid var(--line); color:var(--muted); }
  .step-pill.done { border-color:var(--ok); color:var(--ok); }
  .step-pill.on { border-color:var(--accent); background:var(--accent); color:var(--bg); font-weight:600; }
  .step-pill.wait { border-color:var(--warn); color:var(--warn); font-weight:600; }
  .step-pill.bad { border-color:var(--bad); color:var(--bad); font-weight:600; }
  .collab-card-ux { margin-top:8px; padding:10px; border-radius:8px; border:1px solid var(--warn); background:color-mix(in srgb,var(--warn) 8%,var(--panel)); }
  .collab-conflict { margin-top:6px; padding:8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); font-size:12.5px; }
  .link-chip { cursor:pointer; border:1px solid var(--line); }
  .uxc-stage { position:relative; overflow:auto; background:var(--bg); padding:12px; }
  .uxc-board { position:relative; background-color:var(--panel); background-image:radial-gradient(var(--line) 1px, transparent 1px); background-size:16px 16px; border:1px solid var(--line); border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.08); overflow:hidden; user-select:none; }
  .uxc-arrows { position:absolute; inset:0; pointer-events:none; }
  .uxc-box { position:absolute; border:2px solid var(--accent); background:color-mix(in srgb,var(--panel) 88%, var(--accent) 12%); padding:6px 8px; cursor:move; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .uxc-box.on { box-shadow:0 0 0 2px var(--accent); }
  .uxc-box-head { display:flex; justify-content:space-between; gap:6px; font-size:10.5px; color:var(--muted); }
  .uxc-box-body { font-size:12.5px; line-height:1.3; overflow:hidden; }
  .uxc-box-body small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  .uxc-box-dim { margin-top:auto; font-size:10px; color:var(--muted); }
  .uxc-resize { position:absolute; right:0; bottom:0; width:14px; height:14px; cursor:nwse-resize; background:linear-gradient(135deg,transparent 50%,var(--accent) 50%); opacity:.75; }
  @media (max-width: 1100px) { .ide { grid-template-columns: 200px minmax(0,1fr); } .ide-col.log, .collab-grid, .ide-split { grid-template-columns: 1fr; } }
  .st-M { color:var(--warn); } .st-A, .st-U { color:var(--ok); } .st-D { color:var(--bad); }
  .ide-tabs { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); background:var(--bg); min-height:36px; }
  .ide-tab { display:flex; align-items:center; gap:6px; padding:8px 12px; border:0; border-right:1px solid var(--line); background:none; color:var(--muted);
             font:12px ui-monospace, Menlo, monospace; cursor:pointer; white-space:nowrap; }
  .ide-tab.on { background:var(--panel); color:var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .ide-tab .x { opacity:.5; } .ide-tab .x:hover { opacity:1; }
  .ide-editor { flex:1; min-height:0; position:relative; }
  .ide-empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); text-align:center; padding:24px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; background:none; color:var(--muted); font:inherit; font-size:12px; padding:4px 10px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .seg button.on { background:var(--chip); color:var(--ink); font-weight:600; }
  .commit { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink); padding:9px 12px; cursor:pointer; font:inherit; }
  .commit:hover, .commit.on { background:var(--chip); }
  .commit b { display:block; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .commit span { font-size:11px; color:var(--muted); }
  .linkbtn { text-decoration:none; }
  .studio-frame { display:block; width:100%; height: calc(100vh - 230px); min-height:520px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  .g-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 10px; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; background:var(--panel); }
  .g-kind { display:inline-flex; align-items:center; gap:6px; font:11.5px ui-monospace, Menlo, monospace; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px; padding:4px 10px; cursor:pointer; }
  .g-kind:hover { border-color:var(--accent); } .g-kind i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .g-sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  button.g.on { background:var(--chip); font-weight:600; }
  .g-wrap { display:grid; grid-template-columns: minmax(0,1fr) 300px; height: calc(100vh - 230px); min-height:460px; border:1px solid var(--line); border-radius:0 0 10px 10px; overflow:hidden; background:var(--panel); }
  .g-canvas { position:relative; overflow:hidden; touch-action:none; cursor:grab; user-select:none; }
  .g-canvas:active { cursor:grabbing; }
  .g-svg { width:100%; height:100%; display:block; }
  .g-svg .dot { fill:var(--line); } .g-bg { fill:var(--bg); }
  .g-node { cursor:move; } .g-node .body { fill:var(--panel); stroke:var(--line); stroke-width:1.2; filter: drop-shadow(0 1px 2px rgba(0,0,0,.08)); }
  .g-node:hover .body { stroke:var(--muted); } .g-node.on .body { stroke:var(--accent); stroke-width:2.2; }
  .g-node .t1 { font:600 13px system-ui, sans-serif; fill:var(--ink); } .g-node .t2 { font:10.5px ui-monospace, Menlo, monospace; }
  .g-node .port { fill:var(--panel); stroke:var(--accent); stroke-width:2; cursor:crosshair; } .g-node .port:hover { fill:var(--accent); }
  .g-edge .line { fill:none; stroke:var(--muted); stroke-width:1.8; } .g-edge .hit { fill:none; stroke:transparent; stroke-width:14; cursor:pointer; }
  .g-edge.fail .line { stroke:var(--bad); stroke-dasharray:6 5; } .g-edge:hover .line { stroke-width:2.6; } .g-edge.on .line { stroke:var(--accent); stroke-width:3; }
  .arr-s { fill:var(--muted); } .arr-f { fill:var(--bad); }
  .g-ghost { fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:4 4; pointer-events:none; } .g-ghost.fail { stroke:var(--bad); }
  .g-insp { border-left:1px solid var(--line); overflow:auto; }
  .g-form { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .fld { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); } .fld input, .fld select, .fld textarea { color:var(--ink); font-size:13px; }
  .g-val { padding:10px 12px; border-top:1px solid var(--line); font-size:12.5px; display:flex; flex-direction:column; gap:4px; }
  .g-jsonbox { display:flex; flex-direction:column; min-height:0; } .g-jsonbox textarea { flex:1; border:0; border-radius:0; min-height:0; resize:none; padding:12px; }
  .sp-table td { padding:4px 6px; vertical-align:middle; } .sp-table input.sp-in, .sp-table select.sp-in { width:100%; min-width:90px; padding:4px 6px; font-size:12.5px; border-color:transparent; background:transparent; }
  .sp-table input.sp-in:hover, .sp-table select.sp-in:hover { border-color:var(--line); } .sp-table input.sp-in:focus { border-color:var(--accent); background:var(--panel); outline:none; }
  .sp-in.dirty { box-shadow: inset 2px 0 0 var(--warn); } .sp-in.missing { border-color:var(--bad) !important; }
  tr.row-dirty { background: color-mix(in srgb, var(--warn) 7%, transparent); } tr.row-new { background: color-mix(in srgb, var(--ok) 8%, transparent); }
  tr.detail td { background:var(--bg); padding:10px; } tr.detail textarea { min-height:90px; }
  button.icon { border:0; background:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px; border-radius:4px; } button.icon:hover { background:var(--chip); color:var(--ink); }
  button.icon.bad:hover, button.g.bad { color:var(--bad); }
  .seg button { padding:5px 10px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } nav { display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); } nav button { white-space:nowrap; } section { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>AGDD Console</h1>
  <button class="g" id="studio-link" type="button" style="font-size:12.5px; padding:5px 10px;">노트북 Studio</button>
  <button class="g" id="collab-link" type="button" style="font-size:12.5px; padding:5px 10px;">💬 CLI / 대화 협업</button>
  <div class="row">
    <input id="token" type="password" placeholder="API token" size="22" autocomplete="off">
    <input id="user" placeholder="user id (uuid)" size="38" class="mono">
    <button class="g" id="save">저장</button>
  </div>
  <div class="row">
    <select id="ws"></select>
    <input id="wsname" placeholder="새 워크스페이스 이름" size="18">
    <button class="g" id="mkws">생성</button>
  </div>
</header>
<main>
  <nav id="nav"></nav>
  <div class="content"><section id="view"></section><div id="studio-host" hidden></div></div>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
// Behind https://<host>/agdd/ the IRADE gateway authenticates the ORCID session token; nginx injects the AGDD token and user id.
const GATEWAY = location.pathname.startsWith("/agdd");
// The console must never render inside a frame (e.g. its own Studio iframe after a login redirect).
if (window.top !== window.self) { try { window.top.location.replace(location.href); } catch {} }
const BASE = GATEWAY ? "/agdd/api" : "";
// Same stateless 24 h login as Studio: an HttpOnly session cookie (sent automatically, unreadable here).
// IRADE_SESSION_HINT only says that a session exists.
const IRADE_TOKEN = () => document.cookie.split(";").some(c => c.trim() === "IRADE_SESSION_HINT=1") ? "cookie" : "";
const authHeaders = () => GATEWAY ? {} : { "authorization": "Bearer " + $("#token").value, "x-user-id": $("#user").value };
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g, () => (Math.random()*16|0).toString(16));
$("#token").value = store.get("agdd.token");
$("#user").value = store.get("agdd.user") || uuid();
let WS = store.get("agdd.ws"), TAB = store.get("agdd.tab") || "ide", ES = null, TERM = null;

function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.style.background = bad ? "var(--bad)" : "var(--ink)"; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }
// GET responses are cached (30 s, VM-backed calls 5 min) and in-flight requests are shared, so switching tabs is instant.
// Any mutation clears the cache so the next view shows fresh data.
const CACHE = new Map(), INFLIGHT = new Map();
const SLOW = /\/(vm\/clis|ide\/|vm$)/;
const peek = path => { const c = CACHE.get(path); return c && Date.now() - c.t < (SLOW.test(path) ? 300000 : 30000) ? c.v : undefined; };
async function api(method, path, body, opts = {}) {
  if (method === "GET" && !opts.fresh) {
    const hit = peek(path); if (hit !== undefined) return hit;
    if (INFLIGHT.has(path)) return INFLIGHT.get(path);
  }
  const p = (async () => {
    const r = await fetch(BASE + path, { method, headers: { ...authHeaders(), "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (GATEWAY && r.status === 401) { location.assign("/login?next=/agdd/"); throw new Error("IRADE 로그인이 필요합니다"); }
    if (!r.ok) throw new Error(data.error?.message || data.error || ("HTTP " + r.status));
    if (method === "GET") CACHE.set(path, { t: Date.now(), v: data });
    else if (!opts.noInvalidate) { for (const k of [...CACHE.keys()]) if (!SLOW.test(k)) CACHE.delete(k); }
    return data;
  })();
  if (method === "GET") { INFLIGHT.set(path, p); p.finally(() => INFLIGHT.delete(path)).catch(() => {}); }
  return p;
}
// Prefetch every tab's data in the background once a workspace is chosen (fast calls first, VM calls last).
function prefetch() {
  if (!WS) return;
  const fast = ["/specs", "/conflicts", "/graphs", "/runs", "/hitl", "/dashboard", "/agent-settings", "/vm"];
  Promise.allSettled(fast.map(s => api("GET", `/workspaces/${WS}${s}`))).then(() => {
    api("GET", `/workspaces/${WS}/ide/repos`).catch(() => {}); api("GET", `/workspaces/${WS}/vm/clis`).catch(() => {});
  });
}
// IRADE Studio API (same origin, same login): in gateway mode AGDD workspaces ARE Studio workspaces ("irade-<id>").
async function iradeApi(method, path, body) {
  const r = await fetch(path, { method, credentials: "same-origin", headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { location.assign("/login?next=/agdd/"); throw new Error("IRADE 로그인이 필요합니다"); }
  if (!r.ok) throw new Error(data.message || data.error || ("HTTP " + r.status));
  return data;
}
const iradeId = () => (/^irade-(\d+)$/.exec(WS || "") || [])[1] || "";
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

$("#save").onclick = run(async () => { store.set("agdd.token", $("#token").value); store.set("agdd.user", $("#user").value); await loadWs(); toast("저장됨"); });
$("#mkws").onclick = run(async () => {
  const name = $("#wsname").value.trim(); if (!name) return toast("이름을 입력하세요", true);
  if (GATEWAY) { const w = await iradeApi("POST", "/api/irade/workspaces", { name, description: "IRADE 연구 workspace" }); WS = "irade-" + (w.workspaceId ?? w.canvas_id); }
  else { const w = await api("POST", "/workspaces", { name }); WS = w.workspace_id; }
  store.set("agdd.ws", WS); $("#wsname").value = ""; await loadWs();
});
$("#ws").onchange = () => { WS = $("#ws").value; store.set("agdd.ws", WS); syncUrl(); IDE.repo = ""; IDE.tree = null; prefetch(); render(); };
function syncUrl() {
  const id = iradeId(); const u = new URL(location.href);
  if (id) u.searchParams.set("workspace", id); else u.searchParams.delete("workspace");
  history.replaceState(null, "", u);
}

async function loadWs() {
  let list;
  if (GATEWAY) {

      if (f.enum) return `<td><select class="sp-in${dirty}" data-k="${esc(key)}" data-c="${c}">${f.enum.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select></td>`;

    };

        <td><input type="checkbox" data-sel="${esc(key)}" ${S.sel.has(key) ? "checked" : ""}></td>
        <td><button class="icon" data-open="${esc(key)}" title="상세 편집">${open ? "▾" : "▸"}</button></td>
        ${def.cols.map(c => cell(r, c)).join("")}
        <td class="muted">${S.isNew.has(key) ? "new" : "v" + esc(r.version ?? "")}</td>
        <td><button class="icon bad" data-del="${esc(key)}" title="삭제">✕</button></td></tr>
        ${open ? `<tr class="detail"><td></td><td colspan="${def.cols.length + 3}"><div class="grid2">${longs.map(c => `<label class="fld"><span>${c}</span><textarea class="sp-in" data-k="${esc(key)}" data-c="${c}" rows="4">${esc(r[c] ?? "")}</textarea></label>`).join("")}</div></td></tr>` : ""}`;
    }).join("");
    const ids = t => S.rows[t].map(r => r[SPEC_DEF[t].pk]).filter(Boolean);
    V(`<div class="row" style="justify-content:space-between"><div><h2>명세 테이블</h2><p class="sub" style="margin:0 0 12px">셀을 직접 고치고 <b>변경 저장</b>(Ctrl+S)을 누르면 새 스냅샷으로 저장됩니다. ▸로 긴 항목을 펼쳐 편집하세요. 실행 전 사전 검사를 통과해야 합니다.</p></div>
        <div class="row"><button class="g" id="sp-seed">예시 명세 불러오기</button><button class="g" id="sp-gate">사전 검사로 →</button></div></div>
      <div class="card" style="padding:10px 12px">
        <div class="row" style="justify-content:space-between">
          <span class="seg" id="sp-typ">${["SRS", "ARC", "SCH"].map(k => `<button data-t="${k}" class="${k === S.typ ? "on" : ""}">${k} <span class="muted">${counts(k)}</span></button>`).join("")}</span>
          <div class="row">
            <input id="sp-q" placeholder="검색 (ID, 내용…)" value="${esc(S.q)}" style="width:180px">
            <span class="seg" id="sp-st"><button data-s="" class="${!S.status ? "on" : ""}">전체</button>${SPEC_ST.map(s => `<button data-s="${s}" class="${S.status === s ? "on" : ""}"><span class="${statusCls(s)}">●</span> ${s} ${stCount(s)}</button>`).join("")}</span>
          </div>
        </div>
        <div class="row" style="margin-top:10px; justify-content:space-between">
          <div class="row"><button class="g" id="sp-add">+ 행 추가</button>
            ${S.sel.size ? `<span class="muted">${S.sel.size}개 선택</span><select id="sp-bulk"><option value="">선택 행 상태 변경…</option>${SPEC_ST.map(s => `<option>${s}</option>`).join("")}</select><button class="g bad" id="sp-bulkdel">선택 삭제</button>` : ""}</div>
          <div class="row">${S.dirty.size ? `<span class="warn">저장 안 된 변경 ${S.dirty.size}건</span><button class="g" id="sp-revert">되돌리기</button>` : `<span class="muted">모든 변경 저장됨</span>`}
            <button class="b" id="sp-save" ${S.dirty.size ? "" : "disabled"}>변경 저장</button></div>
        </div>
      </div>
      <div class="card" style="padding:0"><div class="tbl"><table class="sp-table"><tr><th style="width:26px"><input type="checkbox" id="sp-all"></th><th style="width:26px"></th>${def.cols.map(c => `<th>${c}</th>`).join("")}<th>ver</th><th></th></tr>
        ${rowsHtml || `<tr><td colspan="${def.cols.length + 4}" class="muted" style="padding:18px">행이 없습니다. <b>+ 행 추가</b> 또는 예시 명세를 불러오세요.</td></tr>`}</table></div></div>
      <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">추적성 (Traceability)</h3><span class="muted">${S.trace.length}개 링크</span></div>
        <div class="row" style="margin:10px 0">
          <select id="tr-st">${["SRS", "ARC", "SCH"].map(k => `<option>${k}</option>`).join("")}</select><select id="tr-si"></select>
          <select id="tr-rel">${["IMPLEMENTS", "DEPENDS_ON", "PERSISTS_IN", "CONSTRAINS"].map(k => `<option>${k}</option>`).join("")}</select>
          <select id="tr-tt">${["ARC", "SCH", "SRS"].map(k => `<option>${k}</option>`).join("")}</select><select id="tr-ti"></select>
          <button class="g" id="tr-add">링크 추가</button></div>
        <div class="tbl"><table><tr><th>source</th><th>relation</th><th>target</th><th></th></tr>${S.trace.map((t, i) => `<tr><td><span class="chip">${esc(t.source_type)}</span> <span class="mono">${esc(t.source_id)}</span></td><td>${esc(t.relation_type)}</td><td><span class="chip">${esc(t.target_type)}</span> <span class="mono">${esc(t.target_id)}</span></td><td><button class="icon bad" data-tdel="${i}">✕</button></td></tr>`).join("")}</table></div></div>`);
    const find = key => S.rows[key.split(":")[0]].find(r => r.__k === key.slice(key.indexOf(":") + 1));
    $("#view").oninput = e => { const el = e.target.closest(".sp-in"); if (!el) return; const r = find(el.dataset.k); r[el.dataset.c] = el.value;
      document.querySelectorAll(".sp-in").forEach(o => { if (o !== el && o.dataset.k === el.dataset.k && o.dataset.c === el.dataset.c) { o.value = el.value; o.classList.toggle("missing", !el.value.trim()); } });
      el.classList.toggle("missing", !el.value.trim() && el.tagName === "INPUT"); if (!S.dirty.has(el.dataset.k)) { S.dirty.add(el.dataset.k); el.classList.add("dirty"); updateSaveBar(); } };
    $("#view").onchange = e => { const el = e.target; if (el.matches("select.sp-in")) { $("#view").oninput(e); render(); } };
    const updateSaveBar = () => { const b = $("#sp-save"); if (b) { b.disabled = !S.dirty.size; } };
    $("#sp-typ").onclick = e => { const b = e.target.closest("[data-t]"); if (b) { S.typ = b.dataset.t; S.sel.clear(); render(); } };
    $("#sp-st").onclick = e => { const b = e.target.closest("[data-s]"); if (b) { S.status = b.dataset.s; render(); } };
    let qt; $("#sp-q").oninput = () => { clearTimeout(qt); qt = setTimeout(() => { S.q = $("#sp-q").value; render().then(() => { const i = $("#sp-q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 200); };
    $("#sp-add").onclick = () => {
      const n = S.rows[S.typ].length + 1, prefix = { SRS: "REQ", ARC: "ARC", SCH: "SCH" }[S.typ];
      let id; for (let i = n; ; i++) { id = `${prefix}-${String(i).padStart(3, "0")}`; if (!ids(S.typ).includes(id)) break; }
      const r = { __k: "new" + Date.now(), ...SPEC_DEF[S.typ].blank(), [pk]: id }; S.rows[S.typ].unshift(r);
      const key = S.typ + ":" + r.__k; S.isNew.add(key); S.dirty.add(key); S.open.add(key); S.status = ""; S.q = ""; render();
    };
    $("#view").onclick = run(async e => {
      const o = e.target.closest("[data-open]"); if (o) { S.open.has(o.dataset.open) ? S.open.delete(o.dataset.open) : S.open.add(o.dataset.open); return render(); }
      const sel = e.target.closest("[data-sel]"); if (sel) { sel.checked ? S.sel.add(sel.dataset.sel) : S.sel.delete(sel.dataset.sel); return render(); }
      const d = e.target.closest("[data-del]"); if (d) return delRows([d.dataset.del]);
      const td = e.target.closest("[data-tdel]"); if (td) { await api("POST", `/workspaces/${WS}/trace/delete`, S.trace[+td.dataset.tdel]); S.trace.splice(+td.dataset.tdel, 1); toast("링크 삭제됨"); return render(); }
    });
    const delRows = async keys => {
      if (!confirm(`${keys.length}개 행을 삭제할까요? 연결된 추적성 링크도 함께 삭제됩니다.`)) return;
      for (const key of keys) {
        const r = find(key); if (!r) continue; const t = key.split(":")[0];
        if (!S.isNew.has(key)) await api("DELETE", `/workspaces/${WS}/specs/${t}/${encodeURIComponent(r[SPEC_DEF[t].pk])}`);
        S.rows[t] = S.rows[t].filter(x => x !== r); S.dirty.delete(key); S.isNew.delete(key); S.sel.delete(key);
        S.trace = S.trace.filter(x => !((x.source_type === t && x.source_id === r[SPEC_DEF[t].pk]) || (x.target_type === t && x.target_id === r[SPEC_DEF[t].pk])));
      }
      toast(`${keys.length}개 행 삭제됨`); render();
    };
    $("#sp-all").onchange = e => { shown.forEach(r => e.target.checked ? S.sel.add(rowKey(r)) : S.sel.delete(rowKey(r))); render(); };
    if ($("#sp-bulk")) {
      $("#sp-bulk").onchange = () => { const v = $("#sp-bulk").value; if (!v) return; S.sel.forEach(k => { find(k).adoption_status = v; S.dirty.add(k); }); toast(`${S.sel.size}개 행 → ${v} (저장 필요)`); render(); };
      $("#sp-bulkdel").onclick = run(() => delRows([...S.sel]));
    }
    if ($("#sp-revert")) $("#sp-revert").onclick = () => { S.dirty.clear(); S.ws = ""; render(); };
    $("#sp-save").onclick = run(saveSpecs);
    $("#sp-seed").onclick = run(async () => { if (S.dirty.size && !confirm("저장 안 된 변경이 사라집니다. 계속할까요?")) return; await api("POST", `/workspaces/${WS}/seed-example`, {}); S.ws = ""; S.dirty.clear(); toast("예시 명세를 불러왔습니다"); render(); });
    $("#sp-gate").onclick = () => { TAB = "gate"; store.set("agdd.tab", TAB); render(); };
    const fillIds = (sel, t) => { $(sel).innerHTML = ids(t).map(i => `<option>${esc(i)}</option>`).join(""); };
    fillIds("#tr-si", "SRS"); fillIds("#tr-ti", "ARC");
    $("#tr-st").onchange = () => fillIds("#tr-si", $("#tr-st").value); $("#tr-tt").onchange = () => fillIds("#tr-ti", $("#tr-tt").value);
    $("#tr-add").onclick = run(async () => {
      const tr = { source_type: $("#tr-st").value, source_id: $("#tr-si").value, target_type: $("#tr-tt").value, target_id: $("#tr-ti").value, relation_type: $("#tr-rel").value };
      if (!tr.source_id || !tr.target_id) return toast("source/target ID를 선택하세요 (새 행은 먼저 저장)", true);
      await api("PUT", `/workspaces/${WS}/trace`, [tr]); S.trace.push(tr); toast("링크 추가됨"); render();
    });
  },
  async gate() {
    const last = await api("GET", `/workspaces/${WS}/conflicts`);
    V(`<h2>사전 검사 (Pre-Flight Gate)</h2><p class="sub">1) SQL 무결성 → 2) 배치 묶기 → 3) 저렴한 모델 의미 검사 → 4) CRITICAL 0건이면 실행 허가. 모호성 린터도 함께 실행됩니다.</p>
      <div class="card row"><span>최신 스냅샷 v${esc(last.version ?? "-")}: ${last.conflict_passed ? '<b class="ok">통과</b>' : '<b class="warn">미통과/미검사</b>'}</span>
      <label><input type="checkbox" id="sem" checked> 의미 검사</label><label><input type="checkbox" id="amb" checked> 모호성 린터</label><button class="b" id="go">검사 실행</button></div><div id="out"></div>`);
    $("#go").onclick = run(async () => {
      $("#go").disabled = true; $("#out").innerHTML = `<p class="muted">검사 중…</p>`;
      try {
        const r = await api("POST", `/workspaces/${WS}/preflight`, { semantic: $("#sem").checked, ambiguity: $("#amb").checked });
        $("#out").innerHTML = `<div class="card"><b class="${r.passed ? "ok" : "bad"}">${r.passed ? "통과 — 실행 가능" : "차단 — CRITICAL 충돌"}</b> · 스냅샷 ${esc(r.snapshot_id)}</div>` +
          r.conflicts.map(c => `<div class="card"><span class="chip ${c.severity === "CRITICAL" ? "bad" : "warn"}">${esc(c.severity)}</span> <b>${esc(c.conflict_type)}</b> <span class="mono">${esc(c.involved_ids.join(", "))}</span> <span class="muted">${esc(c.check_stage)}</span><p>${esc(c.explanation)}</p><ol>${c.resolution_options.options.map((o, i) => `<li>${esc(o)}${i === c.resolution_options.recommended ? " <span class='chip'>권장</span>" : ""}</li>`).join("")}</ol></div>`).join("") +
          (r.ambiguity_questions.length ? `<div class="card"><h3>미결정 항목 (권장 기본값으로 진행됨)</h3>${r.ambiguity_questions.map(q => `<p><span class="chip">${esc(q.category)}</span> <span class="mono">${esc(q.spec_id)}</span> ${esc(q.question)}<br>${q.options.map((o, i) => i === q.recommended ? `<b>${esc(o)}</b>` : esc(o)).join(" / ")}</p>`).join("")}</div>` : "") +
          (r.scope ? `<div class="card"><h3>Executable Scope</h3><pre>${esc(JSON.stringify(r.scope.requirements.map(x => x.req_id)))} + ARC ${esc(JSON.stringify(r.scope.architecture.map(x => x.arch_id)))} + SCH ${esc(JSON.stringify(r.scope.schemas.map(x => x.schema_id)))}</pre></div>` : "");
      } finally { $("#go").disabled = false; }
    });
  },
  async graphs() {

    if (stale("graphs")) return;

      GRAPH.ws = WS; GRAPH.undo = []; GRAPH.redo = []; GRAPH.sel = null; GRAPH.dirty = false;
      const g = gs.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0];
      GRAPH.gid = g?.graph_id || ""; GRAPH.def = g ? clone(g.definition_json) : GRAPH_TEMPLATE();
      if (GRAPH.def.nodes.some(n => !n.ui)) gLayout(GRAPH.def);
      GRAPH.fit = true;
    }
    V(`<div class="row" style="justify-content:space-between; margin-bottom:10px">
        <div><h2>그래프</h2><p class="sub" style="margin:0">노드를 끌어 배치하고 오른쪽 점을 드래그해 연결하세요. 검증을 통과해야 게시됩니다.</p></div>
        <div class="row"><select id="g-pick"><option value="">+ 새 그래프 (템플릿)</option><option value="__empty">+ 빈 그래프</option>${gs.map(g => `<option value="${esc(g.graph_id)}" ${g.graph_id === GRAPH.gid ? "selected" : ""}>${esc(g.graph_id.slice(0, 8))} · v${g.version} · ${esc(g.definition_json.nodes.length)}노드</option>`).join("")}</select>
          <span id="g-state"></span><button class="b" id="g-pub">게시</button><button class="g" id="g-run" ${GRAPH.gid ? "" : "disabled"}>이 그래프로 실행 →</button></div></div>
      <div class="g-toolbar">
        <span class="muted" style="font-size:12px">노드 추가</span>${Object.keys(KINDS).map(k => `<button class="g-kind" data-add="${k}" title="${esc(KIND_HINT[k])}"><i style="background:${KINDS[k]}"></i>${k}</button>`).join("")}
        <span class="g-sep"></span>
        <button class="g" id="g-undo" title="Ctrl+Z">↶</button><button class="g" id="g-redo" title="Ctrl+Shift+Z">↷</button>
        <button class="g" id="g-layout">자동 정렬</button><button class="g" id="g-fit">화면 맞춤</button><span class="muted mono" id="g-zoom">${Math.round(GRAPH.view.k * 100)}%</span>
        <span class="g-sep"></span><button class="g ${GRAPH.json ? "on" : ""}" id="g-json">{ } JSON</button>
      </div>
      <div class="g-wrap">
        ${GRAPH.json ? `<div class="g-jsonbox"><textarea id="g-text" spellcheck="false">${esc(JSON.stringify(GRAPH.def, null, 2))}</textarea><div class="row" style="padding:8px"><button class="b" id="g-apply">JSON 적용</button><span class="muted">적용하면 캔버스에 반영됩니다.</span></div></div>` : `<div id="g-canvas" class="g-canvas"></div>`}
        <div id="g-insp" class="g-insp"></div>
      </div>`);
    const setDef = (def, gid) => { GRAPH.def = def; GRAPH.gid = gid; GRAPH.undo = []; GRAPH.redo = []; GRAPH.sel = null; GRAPH.dirty = false; if (def.nodes.some(n => !n.ui)) gLayout(def); };
    $("#g-pick").onchange = () => {
      if (GRAPH.dirty && !confirm("게시 안 된 변경이 사라집니다. 계속할까요?")) { $("#g-pick").value = GRAPH.gid; return; }
      const v = $("#g-pick").value;
      if (v === "__empty") setDef({ entry: "", nodes: [], edges: [] }, ""); else if (!v) setDef(GRAPH_TEMPLATE(), "");
      else setDef(clone(gs.find(g => g.graph_id === v).definition_json), v);
      GRAPH.fit = true; render();
    };
    $("#g-json").onclick = () => { GRAPH.json = !GRAPH.json; GRAPH.fit = !GRAPH.json; render(); };
    $("#view").onclick = e => { const b = e.target.closest("[data-add]"); if (b && !GRAPH.json) gAddNode(b.dataset.add); };
    $("#g-undo").onclick = () => { if (!GRAPH.undo.length) return; GRAPH.redo.push(JSON.stringify(GRAPH.def)); GRAPH.def = JSON.parse(GRAPH.undo.pop()); GRAPH.dirty = true; GRAPH.sel = null; GRAPH.json ? render() : gDraw(); };
    $("#g-redo").onclick = () => { if (!GRAPH.redo.length) return; GRAPH.undo.push(JSON.stringify(GRAPH.def)); GRAPH.def = JSON.parse(GRAPH.redo.pop()); GRAPH.dirty = true; GRAPH.json ? render() : gDraw(); };

    $("#g-pub").onclick = run(async () => {

      const r = await api("POST", `/workspaces/${WS}/graphs`, { definition: GRAPH.def, ...(GRAPH.gid ? { graph_id: GRAPH.gid } : {}) });
      GRAPH.gid = r.graph_id; GRAPH.dirty = false; toast(`게시됨 ${String(r.graph_id).slice(0, 8)} v${r.version}`); render();
    });
    $("#g-run").onclick = () => { store.set("agdd.rungraph", GRAPH.gid); TAB = "runs"; store.set("agdd.tab", TAB); render(); };
    if (GRAPH.json) {
      $("#g-insp").innerHTML = gInspector().replace(/<div class="g-form">[\s\S]*<\/div><div class="g-val">/, '<div class="g-val">');
      $("#g-apply").onclick = run(async () => { let d; try { d = JSON.parse($("#g-text").value); } catch (e) { throw new Error("JSON 형식 오류: " + e.message); }
        if (!Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw new Error("nodes[]와 edges[]가 필요합니다");
        gSnapshot(); GRAPH.def = d; if (d.nodes.some(n => !n.ui)) gLayout(d); GRAPH.json = false; GRAPH.fit = true; toast("적용됨"); render(); });

      $("#g-state").innerHTML = GRAPH.dirty ? `<span class="warn">● 게시 안 된 변경</span>` : "";
      return;
    }
    gBindCanvas(); gDraw();
    if (GRAPH.fit) { GRAPH.fit = false; requestAnimationFrame(gFit); }
  },
  async runs() {
    const [gs, rs] = await Promise.all([api("GET", `/workspaces/${WS}/graphs`), api("GET", `/workspaces/${WS}/runs`)]);
    V(`<h2>실행</h2><p class="sub">VM 엔진: 저장소는 VM의 <span class="mono">/workspace/repos/&lt;repo_key&gt;</span>에 git 저장소로 있어야 합니다(VM 터미널에서 clone 또는 데모 저장소). 요청이 작으면 Fast-Track으로 우회합니다. 실행 상세에서 자동화 터미널 이름(agdd-로 시작)을 VM 탭에서 관전할 수 있습니다.</p>
      <div class="card"><div class="row"><select id="gid">${gs.map(g => `<option value="${esc(g.graph_id)}" ${g.graph_id === store.get("agdd.rungraph") ? "selected" : ""}>${esc(g.graph_id.slice(0, 8))} v${g.version} (${esc(g.definition_json.entry)})</option>`).join("")}</select>
      <input id="repo" placeholder="repo_key (예: demo)" value="${esc(store.get("agdd.repo") || "demo")}"></div>
      <div class="row" style="margin-top:8px"><span class="muted">이번 실행만:</span>
        <select id="r_engine"><option value="">엔진 기본</option><option value="vm-cli">VM CLI</option><option value="gateway">Gateway</option></select>
        <select id="r_cli"><option value="">CLI 기본</option><option>claude</option><option>codex</option><option>agy</option></select>
        <input id="r_model" placeholder="모델" size="12"><select id="r_effort"><option value="">추론 기본</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select>
        <input id="r_session" placeholder="세션 (new/per-run/ID)" size="18"></div>
      <textarea id="req" style="min-height:90px;margin-top:8px" placeholder="변경 요청 (예: calc.py의 add 함수 버그를 고치고 테스트를 통과시켜라)"></textarea>
      <div class="row" style="margin-top:8px"><button class="b" id="start" ${gs.length ? "" : "disabled"}>실행 시작</button></div></div>
      <div class="card"><h3>최근 실행</h3><div class="tbl"><table><tr><th>run</th><th>mode</th><th>node</th><th>status</th><th>updated</th></tr>${rs.map(r => `<tr><td><a href="#" data-run="${esc(r.run_id)}" class="mono">${esc(r.run_id.slice(0, 8))}</a></td><td>${esc(r.route_mode)}</td><td>${esc(r.current_node)}</td><td class="${statusCls(r.status)}">${esc(r.status)}</td><td class="muted">${esc(r.updated_at)}</td></tr>`).join("")}</table></div></div><div id="detail"></div>`);
    $("#start").onclick = run(async () => { store.set("agdd.repo", $("#repo").value); const agent = Object.fromEntries([["cli", $("#r_cli").value], ["model", $("#r_model").value.trim()], ["effort", $("#r_effort").value], ["session", $("#r_session").value.trim()]].filter(([, v]) => v));
      const r = await api("POST", `/workspaces/${WS}/runs`, { graph_id: $("#gid").value, request: $("#req").value, repo_key: $("#repo").value, agent, ...($("#r_engine").value ? { engine: $("#r_engine").value } : {}) }); toast(`${r.route_mode} 실행 시작`); await VIEWS.runs(); showRun(r.run_id); });
    document.querySelectorAll("a[data-run]").forEach(a => a.onclick = e => { e.preventDefault(); showRun(a.dataset.run); });
  },
  async hitl() {
    const hs = await api("GET", `/workspaces/${WS}/hitl`);
    V(`<h2>HITL 결정</h2><p class="sub">IRREVERSIBLE은 실행이 멈춰 있습니다. REVERSIBLE은 권장안으로 진행되었고 10:00/16:00 다이제스트로 사후 검토합니다.</p>` +
      (hs.length ? hs.map(h => { const c = h.decision_card_json || {}; return `<div class="card"><span class="chip ${h.reversibility === "IRREVERSIBLE" ? "bad" : "warn"}">${esc(h.reversibility)}</span> <b>${esc(h.reason_code)}</b> <span class="mono muted">run ${esc(String(h.run_id).slice(0, 8))} · ${esc(c.module)}</span>
        <ul>${(c.impact || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>
        <ol>${(c.options || []).map((o, i) => `<li>${esc(o.label)} ${o.pros ? `<span class="ok">+ ${esc(o.pros)}</span>` : ""} ${o.cons ? `<span class="bad">− ${esc(o.cons)}</span>` : ""} ${i === c.recommended ? "<span class='chip'>권장</span>" : ""}</li>`).join("")}</ol>
        <div class="row"><button class="b" data-d="${h.decision_id}" data-s="APPROVED">승인</button><button class="g" data-d="${h.decision_id}" data-s="REJECTED">거절</button></div></div>`; }).join("") : `<div class="card muted">대기 중인 결정이 없습니다.</div>`));
    document.querySelectorAll("button[data-d]").forEach(b => b.onclick = run(async () => { await api("POST", `/hitl/${b.dataset.d}/decide`, { status: b.dataset.s }); toast("결정 저장"); render(); }));
  },
  async ux() {
    V(`<h2>UX 오버라이드</h2><p class="sub">잠금된 항목은 에이전트가 수정할 수 없고, 수정하려는 diff는 Audit에서 차단됩니다. 허용 키: layout, tokens, visibility, order, size, spacing, variant, props.</p>
      <div class="card row"><input id="view" placeholder="view_key (예: home)" value="home"><button class="g" id="load">불러오기</button></div>
      <div class="card"><textarea id="ux">{\n  "#hero": {"config": {"layout": {"columns": 2}}, "locked": true}\n}</textarea><div class="row" style="margin-top:8px"><button class="b" id="saveux">저장</button><input id="unl" placeholder="잠금 해제할 selector"><button class="g" id="unlock">잠금 해제</button></div></div><div id="cur"></div>`);
    const load = run(async () => { const b = await api("GET", `/workspaces/${WS}/ux/${encodeURIComponent($("#view").value)}`); $("#cur").innerHTML = `<div class="card"><h3>현재 바인딩 (ux-overrides.json)</h3><pre>${esc(JSON.stringify(b, null, 2))}</pre></div>`; });
    $("#load").onclick = load; load();
    $("#saveux").onclick = run(async () => { await api("PUT", `/workspaces/${WS}/ux/${encodeURIComponent($("#view").value)}`, JSON.parse($("#ux").value)); toast("저장됨"); load(); });
    $("#unlock").onclick = run(async () => { await api("POST", `/workspaces/${WS}/ux/${encodeURIComponent($("#view").value)}/unlock`, { selectors: [$("#unl").value] }); toast("해제됨"); load(); });
  },
  async research() {
    V(`<h2>즉시 리서치</h2><p class="sub">사내 이름·경로·비밀값·PII를 제거한 질의로 과거 사례 → arXiv / Semantic Scholar / 공식 문서를 검색해 1,000토큰 이내 Insight Brief를 만듭니다.</p>
      <div class="card"><textarea id="prob" style="min-height:120px" placeholder="막힌 문제 / 에러 메시지를 붙여넣으세요"></textarea><div class="row" style="margin-top:8px"><button class="b" id="go">리서치</button></div></div><div id="out"></div>`);
    $("#go").onclick = run(async () => { $("#go").disabled = true; $("#out").innerHTML = `<p class="muted">검색 중… (최대 2~3분)</p>`;
      try { const r = await api("POST", `/workspaces/${WS}/research`, { problem: $("#prob").value });
        $("#out").innerHTML = `<div class="card"><p class="muted">외부 질의: <span class="mono">${esc(r.query)}</span> ${r.reused ? "<span class='chip'>과거 사례 재사용</span>" : ""}</p><pre>${esc(r.insight_brief_md)}</pre>${(r.errors || []).length ? `<p class="warn">일부 검색 실패: ${esc(r.errors.join(", "))}</p>` : ""}</div>`;
      } finally { $("#go").disabled = false; } });
  },
  async dash() {
    const d = await api("GET", `/workspaces/${WS}/dashboard`);
    const b = d.budget;
    V(`<h2>대시보드 · 예산</h2><p class="sub">예산 80% 도달 시 저가 모델로 자동 전환, 100% 도달 시 모델 호출이 차단됩니다.</p>
      <div class="card row">${b ? `<span>${esc(b.period_ym)}: <b>$${Number(b.spent_usd).toFixed(4)}</b> / $${Number(b.limit_usd).toFixed(2)} (${(100 * b.spent_usd / b.limit_usd).toFixed(1)}%)</span>` : "<span class='muted'>예산 미설정 (무제한)</span>"}
      <input id="lim" type="number" min="0" step="1" placeholder="월 한도 USD" style="width:140px"><button class="g" id="setb">설정 (OWNER)</button></div>
      <div class="card"><h3>실행 상태</h3>${d.runs.map(r => `<span class="chip ${statusCls(r.status)}">${esc(r.status)} ${r.n}</span> `).join("") || "<span class='muted'>없음</span>"}</div>
      <div class="card"><h3>최근 7일 모델 사용량</h3><div class="tbl"><table><tr><th>model</th><th>prompt</th><th>cached</th><th>cache hit</th><th>thinking</th><th>cost</th></tr>${d.tokens.map(t => `<tr><td>${esc(t.model_name)}</td><td>${t.p}</td><td>${t.cached}</td><td>${t.p ? (100 * t.cached / t.p).toFixed(0) + "%" : "-"}</td><td>${t.thinking}</td><td>$${Number(t.cost).toFixed(4)}</td></tr>`).join("")}</table></div></div>`);
    $("#setb").onclick = run(async () => { await api("PUT", `/workspaces/${WS}/budget`, { limit_usd: Number($("#lim").value) }); toast("예산 설정됨"); render(); });
  },
};

async function showRun(id) {
  const r = await api("GET", `/runs/${id}`);
  const h = r.handoff_json || {};
  $("#detail").innerHTML = `<div class="card"><h3>run <span class="mono">${esc(id)}</span> <span class="${statusCls(r.status)}">${esc(r.status)}</span> @ ${esc(r.current_node)}</h3>
    <p class="muted">엔진 ${esc(h.engine || "gateway")} ${h.agent && Object.keys(h.agent).length ? "· " + esc(JSON.stringify(h.agent)) : ""} ${h.cli_session ? `· CLI 세션 <span class="mono">${esc(h.cli_session)}</span>` : ""} · 자동화 터미널 <span class="mono">agdd-${esc(id.slice(0, 8))}</span></p>
    ${h.dev_summary ? `<p><b>Dev 요약:</b> ${esc(h.dev_summary)}</p>` : ""}${h.feedback ? `<p class="bad"><b>피드백:</b></p><pre>${esc(h.feedback)}</pre>` : ""}
    ${h.last_patch ? `<details><summary>변경 diff (${esc((h.changed_files || []).join(", "))})</summary><pre>${esc(h.last_patch)}</pre></details>` : ""}
    ${h.insight_brief ? `<details><summary>Insight Brief</summary><pre>${esc(h.insight_brief)}</pre></details>` : ""}
    <h4>노드 실행·비용</h4><div class="tbl"><table><tr><th>node</th><th>model</th><th>prompt</th><th>cached</th><th>out</th><th>thinking</th><th>$</th><th>ms</th></tr>${r.executions.map(e => `<tr><td>${esc(e.node_name)}</td><td>${esc(e.model_name)}</td><td>${e.prompt_tokens}</td><td>${e.cached_tokens}</td><td>${e.output_tokens}</td><td>${e.thinking_tokens}</td><td>${Number(e.cost_usd).toFixed(5)}</td><td>${e.duration_ms}</td></tr>`).join("")}</table></div>
    <h4>실시간 로그</h4><pre id="logs"></pre></div>`;
  if (ES) ES.close();
  // EventSource cannot send headers, so the log stream is read with fetch + ReadableStream.
  const ctl = new AbortController(); ES = { close: () => ctl.abort() };
  fetch(`${BASE}/runs/${id}/logs`, { headers: authHeaders(), signal: ctl.signal }).then(async res => {
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) { const ev = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = ev.split("\n").find(l => l.startsWith("data: ")); if (line && $("#logs")) { $("#logs").textContent += JSON.parse(line.slice(6)).line + "\n"; $("#logs").scrollTop = 1e9; } } }
  }).catch(() => {});
}

$("#studio-link").onclick = () => { TAB = "ide"; IDE.pane = "studio"; store.set("agdd.tab", TAB); store.set("agdd.idepane", "studio"); render(); };
$("#collab-link").onclick = () => { TAB = "collab"; store.set("agdd.tab", TAB); render(); };
window.AGDD = {
  $, esc, api, iradeId, peek, CACHE, store, toast, run, stale, V,
  authHeaders, openTerminal, loadMonaco, langOf, darkMode, statusCls, fitStudio, render,
  VIEWS, IDE, COLLAB, UXC,
  getWS: () => WS, getTAB: () => TAB, getBASE: () => BASE,
  openTab(tab, opts = {}) {
    TAB = tab; store.set("agdd.tab", tab);
    if (opts.collabMode) { COLLAB.mode = opts.collabMode; store.set("agdd.collabmode", opts.collabMode); }
    if (opts.uxView) UXC.view = opts.uxView;
    if ("uxDecisionId" in opts) UXC.decisionId = opts.uxDecisionId;
    if ("uxPending" in opts) UXC.pendingReq = opts.uxPending;
    render();
  },
};
{ const q = new URL(location.href).searchParams;  // deep links: /agdd/?tab=ide&pane=studio&workspace=N
  if (q.get("tab") && /^[a-z]+$/.test(q.get("tab"))) { if (TABS[q.get("tab")]) TAB = q.get("tab"); }
  if (["files", "studio", "split"].includes(q.get("pane"))) IDE.pane = q.get("pane");
  if (["chat", "cli"].includes(q.get("mode"))) COLLAB.mode = q.get("mode");
  if (q.get("view") && /^[A-Za-z0-9_.-]{1,64}$/.test(q.get("view"))) UXC.view = q.get("view"); }
