# AGDD platform (DOC.md §2, §7). Every architecture component runs as its own container.
#   docker compose -f docker-compose.agdd.yml --env-file agdd.env up -d --build
#   PHASE_3 OLAP job:  docker compose -f docker-compose.agdd.yml --profile phase3 run --rm analytics
name: irade-agdd

x-agdd-env: &agdd-env
  TZ: ${AGDD_TZ:-Asia/Seoul}   # HITL digest slots (10:00/16:00) and partitions use local time
  PG_DSN: postgresql://${AGDD_PG_USER:-agdd}:${AGDD_PG_PASSWORD:?Set AGDD_PG_PASSWORD}@pgbouncer:6432/agdd
  PG_REPLICA_DSN: postgresql://${AGDD_PG_USER:-agdd}:${AGDD_PG_PASSWORD}@pgbouncer:6432/agdd_ro
  PG_DIRECT_DSN: postgresql://${AGDD_PG_USER:-agdd}:${AGDD_PG_PASSWORD}@postgres:5432/agdd
  VALKEY_URL: redis://valkey:6379/0
  S3_ENDPOINT: http://object-storage:8333
  S3_BUCKET: ${AGDD_S3_BUCKET:-agdd}
  S3_ACCESS_KEY: ${AGDD_S3_ACCESS_KEY:-agdd}
  S3_SECRET_KEY: ${AGDD_S3_SECRET_KEY:?Set AGDD_S3_SECRET_KEY}
  LLM_GATEWAY_URL: http://llm-gateway:8090/v1
  LLM_GATEWAY_TOKEN: ${AGDD_GATEWAY_TOKEN:?Set AGDD_GATEWAY_TOKEN}
  INTERNAL_TOKEN: ${AGDD_INTERNAL_TOKEN:?Set AGDD_INTERNAL_TOKEN}
  RESEARCH_URL: http://research:8092
  AGDD_CHEAP_MODEL: cheap
  AGDD_EMBED_MODEL: ${AGDD_EMBED_MODEL:-}

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  # ---------------- Data plane ----------------
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${AGDD_PG_USER:-agdd}
      POSTGRES_PASSWORD: ${AGDD_PG_PASSWORD}
      POSTGRES_DB: agdd
      PG_REPLICATION_PASSWORD: ${AGDD_PG_REPLICATION_PASSWORD:?Set AGDD_PG_REPLICATION_PASSWORD}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "max_replication_slots=5",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    volumes:
      - agdd-pg:/var/lib/postgresql/data
      - ./docker/agdd/pg-primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agdd"]
      interval: 5s
      retries: 20
    networks: [agdd-data]
    restart: unless-stopped

  postgres-replica:
    image: pgvector/pgvector:pg17
    user: postgres
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${AGDD_PG_USER:-agdd}
      PGDATA: /var/lib/postgresql/data/pgdata
      PG_REPLICATION_PASSWORD: ${AGDD_PG_REPLICATION_PASSWORD}
    volumes:
      - agdd-pg-replica:/var/lib/postgresql/data
      - ./docker/agdd/pg-replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 40
    networks: [agdd-data]
    restart: unless-stopped

  pgbouncer:
    image: irade-agdd-pgbouncer:local
    build: {context: ./docker/agdd, dockerfile: pgbouncer.Dockerfile}
    environment:
      PG_USER: ${AGDD_PG_USER:-agdd}
      PG_PASSWORD: ${AGDD_PG_PASSWORD}
      PG_DB: agdd
    depends_on:
      postgres: {condition: service_healthy}
      postgres-replica: {condition: service_started}
    networks: [agdd-data]
    <<: *hardening

  valkey:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
    networks: [agdd-data]
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${AGDD_S3_ACCESS_KEY:-agdd}
      S3_SECRET_KEY: ${AGDD_S3_SECRET_KEY:?Set AGDD_S3_SECRET_KEY}
    volumes:
      - agdd-objects:/data
      - ./docker/agdd/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    networks: [agdd-data]
    restart: unless-stopped

  # Ephemeral Test RDB: tmpfs-backed; the worker creates/drops one database branch per VERIFY job.
  test-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: ${AGDD_TESTDB_PASSWORD:?Set AGDD_TESTDB_PASSWORD}
      POSTGRES_DB: verify
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs: [/var/lib/postgresql/data]
    networks: [agdd-sandbox]
    restart: unless-stopped

  # ---------------- Application & control layer ----------------
  agdd-api:
    image: irade-agdd:local
    build: {context: ./agent, dockerfile: ../docker/agdd/agdd.Dockerfile}
    command: ["python", "-m", "irade_agent.agdd.api"]
    environment:
      <<: *agdd-env
      API_TOKEN: ${AGDD_API_TOKEN:?Set AGDD_API_TOKEN}
      PORT: "8091"
    ports: ["127.0.0.1:${AGDD_API_PORT:-18091}:8091"]
    depends_on:
      pgbouncer: {condition: service_started}
      valkey: {condition: service_healthy}
      llm-gateway: {condition: service_started}
    networks:
      agdd-data: {}
      agdd-app: {}
      # Shared with irade-nginx so https://<host>/agdd/ can reach the console behind IRADE login.
      irade-web: {aliases: [irade-agdd-api]}
    <<: *hardening

  llm-gateway:
    image: irade-agdd:local
    command: ["python", "-m", "irade_agent.agdd.llm_gateway"]
    environment:
      <<: *agdd-env
      PORT: "8090"
      UPSTREAM_BASE_URL: ${AGDD_UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      UPSTREAM_API_KEY: ${AGDD_UPSTREAM_API_KEY:?Set AGDD_UPSTREAM_API_KEY}
      MODEL_CHEAP: ${AGDD_MODEL_CHEAP:-gpt-5-nano}
      MODEL_MID: ${AGDD_MODEL_MID:-gpt-5-mini}
      MODEL_ADVISOR: ${AGDD_MODEL_ADVISOR:-gpt-5}
      MODEL_PRICES: ${AGDD_MODEL_PRICES:-}
      CHEAP_REASONING_EFFORT: ${AGDD_CHEAP_REASONING_EFFORT:-low}
    depends_on:
      pgbouncer: {condition: service_started}
    networks: [agdd-data, agdd-app, agdd-sandbox, agdd-egress]
    <<: *hardening

  research:
    image: irade-agdd:local
    command: ["python", "-m", "irade_agent.agdd.research_service"]
    environment:
      <<: *agdd-env
      PORT: "8092"
      S2_API_KEY: ${AGDD_S2_API_KEY:-}
      DOCS_SEARCH_URL: ${AGDD_DOCS_SEARCH_URL:-}
      INTERNAL_NAMES: ${AGDD_INTERNAL_NAMES:-irade,frelog,agora}
    depends_on:
      pgbouncer: {condition: service_started}
      object-storage: {condition: service_started}
    networks: [agdd-data, agdd-app, agdd-sandbox, agdd-egress]
    <<: *hardening

  scheduler:
    image: irade-agdd:local
    command: ["python", "-m", "irade_agent.agdd.scheduler"]
    environment:
      <<: *agdd-env
      ANALYTICS_ENABLED: ${AGDD_ANALYTICS_ENABLED:-1}
      NODE_EXEC_RETENTION_MONTHS: ${AGDD_RETENTION_MONTHS:-6}
    depends_on:
      agdd-api: {condition: service_started}   # api runs migrations first
    networks: [agdd-data]
    <<: *hardening

  # ---------------- Isolated agent worker sandbox ----------------
  # No egress network: models only via llm-gateway, papers only via research. Scale with
  #   docker compose ... up -d --scale worker=N    (set AGDD_WORKER_RUNTIME=runsc for gVisor)
  worker:
    image: irade-agdd-worker:local
    build:
      context: ./agent
      dockerfile: ../docker/agdd/worker.Dockerfile
      args: {INSTALL_PLAYWRIGHT: "${AGDD_INSTALL_PLAYWRIGHT:-1}"}
    runtime: ${AGDD_WORKER_RUNTIME:-runc}
    user: "${AGDD_UID:-1000}:${AGDD_GID:-1000}"   # owner of AGDD_WORKSPACE_DIR, so git apply can write
    environment:
      <<: *agdd-env
      TEST_DB_ADMIN_DSN: postgresql://verify:${AGDD_TESTDB_PASSWORD}@test-db:5432/verify
      JOB_LEASE: ${AGDD_JOB_LEASE:-10 minutes}
    volumes:
      - ${AGDD_WORKSPACE_DIR:-./agdd-workspace}:/workspace
    depends_on:
      pgbouncer: {condition: service_started}
      llm-gateway: {condition: service_started}
      test-db: {condition: service_started}
    networks: [agdd-data, agdd-sandbox]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: ${AGDD_WORKER_MEM:-4g}
    restart: unless-stopped

  # ---------------- PHASE_3: OLAP (DuckDB over Parquet in object storage) ----------------
  analytics:
    image: irade-agdd:local
    profiles: [phase3]
    command: ["python", "-m", "irade_agent.agdd.analytics"]
    environment:
      <<: *agdd-env
      ANALYTICS_DAYS: "90"
    networks: [agdd-data, agdd-egress]   # egress only to fetch the DuckDB httpfs extension
    restart: "no"

networks:
  agdd-data: {internal: true}
  agdd-sandbox: {internal: true}
  agdd-app: {}
  agdd-egress: {}
  irade-web: {external: true, name: irade-web}

volumes:
  agdd-pg:
  agdd-pg-replica:
  agdd-objects:
